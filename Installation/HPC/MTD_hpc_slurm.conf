# MTD Explorer independent Slurm backend configuration.
# This file is sourced as trusted Bash. Do not use an untrusted file.

MTD_HPC_SCHEDULER="slurm"

# Every compute node is prepared by Installation/HPC/MTD_install_HPC_nodes.sh.
MTD_HPC_PREFIX="/MTD_explorer_HPC"
MTD_HPC_ENV_DIR="${MTD_HPC_PREFIX}/envs/MTD-Explorer-HPC"
MTD_HPC_FASTP_ENV_DIR="${MTD_HPC_PREFIX}/envs/MTD_fastp"
MTD_HPC_KRAKEN2_ENV_DIR="${MTD_HPC_PREFIX}/envs/MTD_kraken2"
MTD_HPC_CONDA_BIN="${MTD_HPC_PREFIX}/miniconda3/bin/conda"

# Databases copied from the main MTD Explorer installation.
MTD_HPC_DATABASE_ROOT="${MTD_HPC_PREFIX}/databases"
MTD_HPC_MTD_DATABASE_ROOT="${MTD_HPC_DATABASE_ROOT}/MTD-Explorer"
MTD_HPC_HUMANN_DB_ROOT="${MTD_HPC_MTD_DATABASE_ROOT}/HUMAnN/ref_database"
MTD_HPC_METAPHLAN_INDEX="mpa_vJun23_CHOCOPhlAnSGB_202403"

# Slurm submission settings. Empty values are omitted.
MTD_HPC_PARTITION="debug"
MTD_HPC_ACCOUNT=""
MTD_HPC_QOS=""

# Strongly recommended when the partition contains nodes that were not prepared
# with MTD_install_HPC_nodes.sh. Configure the matching Slurm feature separately.
MTD_HPC_CONSTRAINT=""

MTD_HPC_TIME="48:00:00"
MTD_HPC_MAX_PARALLEL=100

# How often the submitter checks Slurm and success markers internally.
# This controls responsiveness, not how often progress is printed.
MTD_HPC_POLL_SECONDS=20

# Print progress immediately when the number of successful, running or pending
# tasks changes. This keeps long-running stages informative without repeating
# identical lines on every polling cycle.
MTD_HPC_PROGRESS_ON_CHANGE=1

# If nothing changes for this many seconds, print one heartbeat so the user can
# see that the stage is still being monitored. Set to 0 to disable heartbeats.
MTD_HPC_PROGRESS_HEARTBEAT_SECONDS=300

# -------------------------------------------------------------------------
# Node-local task staging
# -------------------------------------------------------------------------
#
# Inputs are copied from shared storage to the compute node after Slurm has
# selected the node. Processing and temporary output creation happen locally;
# only validated final outputs are copied atomically back to shared storage.
MTD_HPC_STAGE_LOCAL=1
MTD_HPC_LOCAL_SCRATCH_ROOT="${MTD_HPC_PREFIX}/tmp"

# Limit simultaneous large transfers across all tasks in the same Slurm stage.
# With a 100 Mb/s source/shared link, 1 avoids splitting that bandwidth across
# several workers. A worker releases the stage-in slot immediately after its
# complete input set (R1/R2 when paired) is local, so computation overlaps with
# the next worker's transfer. Stage-in and stage-out use independent slot pools,
# allowing one transfer in each direction at the same time. Set either value to
# 0 to disable that global throttle.
MTD_HPC_STAGEIN_MAX_CONCURRENT=1
MTD_HPC_STAGEOUT_MAX_CONCURRENT=1

# Workers waiting for one of the shared transfer slots retry at this interval.
MTD_HPC_TRANSFER_LOCK_POLL_SECONDS=1

# Cluster-wide slots use atomic mkdir on the shared filesystem instead of
# flock. This works on NFS clients mounted with nolock/local_lock=all. If a
# worker is killed while holding a slot, another worker may reclaim the lock
# only after this age and only after Slurm confirms that its owner is gone.
MTD_HPC_TRANSFER_LOCK_STALE_SECONDS=300

# In addition to the cluster-wide stage-out limit above, packed jobs on one
# node can retain a node-local lock to prevent same-node write bursts when the
# global stage-out limit is configured above 1.
MTD_HPC_SERIALIZE_STAGEOUT_PER_NODE=1

# Successful task scratch is removed automatically. Failed task scratch is
# retained for diagnosis and its path is printed in the Slurm error log.
MTD_HPC_CLEAN_LOCAL_ON_SUCCESS=1
MTD_HPC_CLEAN_LOCAL_ON_FAILURE=0

# Before copying large FASTQs, reserve this much free node-local storage and
# require a stage-specific multiple of the total input size. This catches
# "No space left on device" before a task starts expensive processing.
MTD_HPC_SCRATCH_RESERVE_GB=10
MTD_HPC_FASTP_SCRATCH_MULTIPLIER=3
MTD_HPC_KRAKEN_SCRATCH_MULTIPLIER=3

# Raw FASTQs can live on storage mounted only on the machine that launched
# MTD Explorer (for example a local /media/... disk). If a Slurm worker cannot
# see that input path, it pulls the file directly into node-local scratch with
# rsync over passwordless SSH from the dynamically detected submission host.
# The submission hostname is detected at runtime; no machine name is hard-coded.
MTD_HPC_REMOTE_INPUT_FROM_SUBMIT_HOST=1
MTD_HPC_SUBMIT_SSH_CONNECT_TIMEOUT=10


# -------------------------------------------------------------------------
# Slurm resource policies
# -------------------------------------------------------------------------
#
# No --nodelist is configured here. Slurm may therefore use any eligible
# idle node in MTD_HPC_PARTITION that satisfies MTD_HPC_CONSTRAINT.
#
# This generic policy is retained as a backward-compatible fallback for
# stages that do not define their own stage-specific submission options.
MTD_HPC_SBATCH_EXTRA_ARGS=(
  --exclusive
  --nodes=1
  --mem=0
)

# HUMAnN/MetaPhlAn processes one sample per task and benefits from the whole
# heterogeneous node. The job detects the CPUs and memory after it starts.
MTD_HPC_HUMANN_SBATCH_EXTRA_ARGS=(
  --exclusive
  --nodes=1
  --mem=0
)

# fastp processes one complete sample per array task. Each task receives one
# whole node and automatically uses the CPUs granted by Slurm.
MTD_HPC_FASTP_SBATCH_EXTRA_ARGS=(
  --exclusive
  --nodes=1
  --mem=0
)

# Kraken2 host filtering, microbiome classification and Bracken process one
# sample per array task. The node-local Kraken2 database is shared only by the
# task on that exclusive node, avoiding memory contention between samples.
MTD_HPC_KRAKEN_SBATCH_EXTRA_ARGS=(
  --exclusive
  --nodes=1
  --mem=0
)

# Magic-BLAST is parallelized primarily across synchronized FASTQ chunks.
# Each chunk receives one CPU, allowing Slurm to pack several independent
# chunk tasks onto the same node according to its available CPUs and memory.
#
# The 8 GiB allocation was validated in the Magic-BLAST chunk smoke test.
# Slurm will automatically run fewer simultaneous chunks on smaller nodes.
MTD_HPC_MAGICBLAST_SBATCH_EXTRA_ARGS=(
  --nodes=1
  --ntasks=1
  --cpus-per-task=1
  --mem=8G
)

# Magic-BLAST is split by synchronized FASTQ records before submission.
# 0 disables splitting and sends one task per sample.
#
# One million paired or single-end records per chunk is the production
# default. Smaller values create more jobs and more temporary SAM files.
MTD_HPC_MAGICBLAST_CHUNK_READS=1000000

# Reuse only matching success markers whose expected outputs still exist.
MTD_HPC_RESUME=1

# -------------------------------------------------------------------------
# Automatic retry policy
# -------------------------------------------------------------------------
#
# Total number of executions allowed for each incomplete task. A value of 1
# disables automatic retry and preserves the original single-attempt behavior.
MTD_HPC_MAX_ATTEMPTS=3

# Wait before submitting only the tasks that remain incomplete.
MTD_HPC_RETRY_DELAY_SECONDS=20

# When a task leaves a matching .failed marker, exclude that node from later
# retry rounds in the same stage. This helps move node-specific failures such
# as full local scratch storage to another eligible compute node.
MTD_HPC_RETRY_EXCLUDE_FAILED_NODES=1

# -------------------------------------------------------------------------
# Final submission-node fallback
# -------------------------------------------------------------------------
#
# After all normal attempts are exhausted, submit only the remaining tasks to
# the Slurm compute node corresponding to the host that launched MTD Explorer.
# No hostname is hard-coded: the submitter resolves the current host against
# Slurm NodeName, NodeHostName, NodeAddr and local interface addresses.
MTD_HPC_FINAL_SUBMIT_NODE_FALLBACK=1

# Number of final executions allowed on the resolved submission node.
MTD_HPC_FINAL_SUBMIT_NODE_ATTEMPTS=1

# Optional mappings for databases outside the MTD Explorer repository.
# Format: "MAIN_MACHINE_PREFIX=NODE_LOCAL_PREFIX"
# The longest matching source prefix wins.
MTD_HPC_PATH_MAPS=(
  # "/media/me/custom_db=/MTD_explorer_HPC/databases/custom_db"
)
