# MTD Explorer independent Slurm backend configuration.
# This file is sourced as trusted Bash. Do not use an untrusted file.

MTD_HPC_SCHEDULER="slurm"

# Every compute node is prepared by Installation/HPC/MTD_install_HPC_nodes.sh.
MTD_HPC_PREFIX="/MTD_explorer_HPC"
MTD_HPC_ENV_DIR="${MTD_HPC_PREFIX}/envs/MTD-Explorer-HPC"
MTD_HPC_CONDA_BIN="${MTD_HPC_PREFIX}/miniconda3/bin/conda"

# Databases copied from the main MTD Explorer installation.
MTD_HPC_DATABASE_ROOT="${MTD_HPC_PREFIX}/databases"
MTD_HPC_MTD_DATABASE_ROOT="${MTD_HPC_DATABASE_ROOT}/MTD-Explorer"
MTD_HPC_HUMANN_DB_ROOT="${MTD_HPC_MTD_DATABASE_ROOT}/HUMAnN/ref_database"
MTD_HPC_METAPHLAN_INDEX="mpa_vJun23_CHOCOPhlAnSGB_202403"

# Slurm submission settings. Empty values are omitted.
MTD_HPC_PARTITION="debug"
MTD_HPC_ACCOUNT=""
MTD_HPC_QOS=""

# Strongly recommended when the partition contains nodes that were not prepared
# with MTD_install_HPC_nodes.sh. Configure the matching Slurm feature separately.
MTD_HPC_CONSTRAINT=""

MTD_HPC_TIME="48:00:00"
MTD_HPC_MAX_PARALLEL=100
MTD_HPC_POLL_SECONDS=20


# -------------------------------------------------------------------------
# Slurm resource policies
# -------------------------------------------------------------------------
#
# No --nodelist is configured here. Slurm may therefore use any eligible
# idle node in MTD_HPC_PARTITION that satisfies MTD_HPC_CONSTRAINT.
#
# This generic policy is retained as a backward-compatible fallback for
# stages that do not define their own stage-specific submission options.
MTD_HPC_SBATCH_EXTRA_ARGS=(
  --exclusive
  --nodes=1
  --mem=0
)

# HUMAnN/MetaPhlAn processes one sample per task and benefits from the whole
# heterogeneous node. The job detects the CPUs and memory after it starts.
MTD_HPC_HUMANN_SBATCH_EXTRA_ARGS=(
  --exclusive
  --nodes=1
  --mem=0
)

# Magic-BLAST is parallelized primarily across synchronized FASTQ chunks.
# Each chunk receives one CPU, allowing Slurm to pack several independent
# chunk tasks onto the same node according to its available CPUs and memory.
#
# The 8 GiB allocation was validated in the Magic-BLAST chunk smoke test.
# Slurm will automatically run fewer simultaneous chunks on smaller nodes.
MTD_HPC_MAGICBLAST_SBATCH_EXTRA_ARGS=(
  --nodes=1
  --ntasks=1
  --cpus-per-task=1
  --mem=8G
)

# Magic-BLAST is split by synchronized FASTQ records before submission.
# 0 disables splitting and sends one task per sample.
#
# One million paired or single-end records per chunk is the production
# default. Smaller values create more jobs and more temporary SAM files.
MTD_HPC_MAGICBLAST_CHUNK_READS=1000000

# Reuse only matching success markers whose expected outputs still exist.
MTD_HPC_RESUME=1

# Optional mappings for databases outside the MTD Explorer repository.
# Format: "MAIN_MACHINE_PREFIX=NODE_LOCAL_PREFIX"
# The longest matching source prefix wins.
MTD_HPC_PATH_MAPS=(
  # "/media/me/custom_db=/MTD_explorer_HPC/databases/custom_db"
)
